{% extends "base.html" %}
{% block title %}Page not found{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
  <div class="glass-panel p-8 text-center">
    <span class="emoji text-5xl" aria-hidden="true">💧</span>
    <h1 class="text-2xl font-extrabold tracking-tight text-deep mt-4" data-i18n="e404.title">This page has dried up</h1>
    <p class="text-sm text-ink/70 mt-2" data-i18n="e404.text">The link may be old. Head back home, or check your water again.</p>
    <div class="flex flex-wrap gap-3 justify-center mt-6">
      <a class="btn-primary" href="{{ url_for('home') }}" data-i18n="nav.home">Home</a>
      <a class="btn-secondary" href="{{ url_for('check') }}" data-i18n="home.cta">Check my water</a>
    </div>
  </div>
</div>
{% endblock %}
